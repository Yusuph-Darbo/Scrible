services:
  api:
    build: .
    ports:
      - 8000:8000
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yusuphdarbo"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
